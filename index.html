<!-- CLEANUP NOTE: The original file had a <header>, <nav> and <main> before the doctype,
     a footer after </html>, and a second copy of the page pasted after that. Everything
     now lives in one valid document. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CHANGED: replaced the placeholder text "One sentence describing this page." with a real description -->
  <meta name="description" content="Home page for Kaelan Percival, a game enthusiast and mountain biker.">
  <title>Kaelan Percival — Studio Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CHANGED: applies the saved dark mode choice before the page is drawn, so the page does not flash light first -->
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- CHANGED: the header and nav were moved inside <body>. The site name h1 was moved here from <main>
       so it matches the header on the other pages. -->
  <header>
    <h1>Kaelan Percival</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="work.html">My Work</a>
      <!-- CHANGED: dark mode toggle button restored. Its label is set by script.js. -->
      <button class="theme-toggle" id="theme-toggle-btn">🌙 Dark Mode</button>
    </nav>
  </header>

  <!-- CHANGED: added a single <main> wrapper for the page content -->
  <main>
    <img src="images/avatar.png" alt="Cartoon avatar with orange background, grey hoodie and red glasses" width="200">
    <p>Game Enthusiast and Mountain Biker</p>
    <p>Web Department.</p>
  </main>

  <!-- CHANGED: footer moved inside <body>, "&copy" fixed to "&copy;", and the name made consistent with the other pages.
       The copy-pasted fact generator (with its own dark mode toggle) that was after </html> was removed. -->
  <footer>
    <p>&copy; 2026 Kaelan Percival</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
