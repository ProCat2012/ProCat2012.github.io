<!-- CLEANUP NOTE: The original file had a <header> before the doctype, a stray <main> before <body>,
     and a second copy of the page (the fact generator) after </html>. Everything now lives in one
     valid document. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CHANGED: replaced the placeholder text with a real description -->
  <meta name="description" content="Kaelan Percival's goals for the year: a mobile game, a fully functioning website, and a Windows app.">
  <title>My Work — Kaelan Percival</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CHANGED: applies the saved dark mode choice before the page is drawn, so the page does not flash light first -->
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- CHANGED: header and nav moved inside <body>. The h1 site name was added to match the other pages. -->
  <header>
    <h1>Kaelan Percival</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="work.html">My Work</a>
      <!-- CHANGED: dark mode toggle button restored. Its label is set by script.js. -->
      <button class="theme-toggle" id="theme-toggle-btn">🌙 Dark Mode</button>
    </nav>
  </header>

  <!-- CHANGED: added a single <main> wrapper. The old file had a stray one before the doctype and one after </html>. -->
  <main>
    <h1>My Work</h1>
    <p>Coming soon — here's what I'm hoping to build this year:</p>
    <!-- CHANGED: fixed the spelling "moblie" to "mobile" and "fuly" to "fully". Added the missing
         </li> closing tag and a capital "PC" for "Windows PC". -->
    <ul>
      <li>A mobile game for iOS and Android</li>
      <li>Create a fully functioning website on my own</li>
      <li>Create an app for a Windows PC</li>
    </ul>
  </main>

  <!-- CHANGED: footer moved inside <body>, "&copy" fixed to "&copy;", and the name made consistent.
       The copy-pasted fact generator that was after </html> was removed. -->
  <footer>
    <p>&copy; 2026 Kaelan Percival</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
